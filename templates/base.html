<style>
/* ---------- tokens ---------- */
:root{
  --paper:#F7F7F5; --card:#FFFFFF; --sunk:#EFEFEC;
  --ink:#0E1012; --body:#3E4449; --mute:#6B737A; --faint:#939BA2;
  --rule:#E0E0DB; --rule2:#C6C6BF;
  --blue:#1F45C8; --blue-soft:#E7EBFB;
  --display:'Instrument Serif',Georgia,'Times New Roman',serif;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;

  --wrap:1140px;
  --pad:clamp(20px,5vw,44px);
  --gap:clamp(16px,2.2vw,22px);
  --sec-y:clamp(52px,7vw,84px);
  --label-col:clamp(110px,15vw,168px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0D0F11; --card:#14171A; --sunk:#101315;
    --ink:#F1F2F1; --body:#B9C0C5; --mute:#8E969D; --faint:#6B737A;
    --rule:#232830; --rule2:#343B45;
    --blue:#8FA6FF; --blue-soft:#161C33;
  }
}
:root[data-theme="dark"]{
  --paper:#0D0F11; --card:#14171A; --sunk:#101315;
  --ink:#F1F2F1; --body:#B9C0C5; --mute:#8E969D; --faint:#6B737A;
  --rule:#232830; --rule2:#343B45;
  --blue:#8FA6FF; --blue-soft:#161C33;
}

/* ---------- base ---------- */
*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{
  margin:0; background:var(--paper); color:var(--body);
  font-family:var(--sans); font-weight:300;
  font-size:clamp(15.5px,1.05vw,17px); line-height:1.62;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overflow-wrap:break-word;
}
h1,h2,h3,h4{ margin:0; color:var(--ink); text-wrap:balance; }
p{ margin:0; }
a{ color:var(--blue); text-decoration:none; }
a:hover{ text-decoration:underline; text-underline-offset:3px; }
a:focus-visible,button:focus-visible{ outline:2px solid var(--blue); outline-offset:3px; border-radius:2px; }
img{ max-width:100%; height:auto; }
::selection{ background:var(--blue); color:#fff; }

.wrap{ width:100%; max-width:var(--wrap); margin-inline:auto; padding-inline:var(--pad); }
.band{ border-top:1px solid var(--rule); }
.eyebrow{ font-family:var(--mono); font-size:clamp(10px,1.05vw,11.5px); letter-spacing:.15em;
          text-transform:uppercase; color:var(--blue); font-weight:500; }
.sec-label{ font-family:var(--mono); font-size:11px; letter-spacing:.15em;
            text-transform:uppercase; color:var(--faint); }

/* ---------- masthead ---------- */
.mast{ display:flex; flex-wrap:wrap; gap:10px clamp(16px,3vw,34px); align-items:baseline;
       padding-block:22px; font-family:var(--mono);
       font-size:clamp(10px,1.05vw,11.5px); letter-spacing:.09em;
       text-transform:uppercase; color:var(--mute); }
.mast .nm{ color:var(--ink); font-weight:500; }
.mast .mark{ width:24px; height:24px; border-radius:6px; vertical-align:-7px; margin-inline-end:9px; }
.mast .avail{ display:inline-flex; align-items:center; gap:8px; color:var(--blue);
              margin-inline-start:auto; }
.dot{ width:6px; height:6px; border-radius:50%; background:var(--blue); flex:none; }

/* ---------- hero ---------- */
.hero{ padding-block:clamp(40px,6.5vw,62px) clamp(48px,7vw,70px); }
.hero h1{
  font-family:var(--display); font-weight:400; font-style:normal;
  font-size:clamp(38px,7.6vw,88px); line-height:1.03; letter-spacing:-.017em;
  max-width:18ch; margin-top:clamp(14px,2vw,20px);
}
.hero h1 em{ font-style:italic; color:var(--blue); }
.hero .lede{ margin-top:clamp(20px,3vw,30px); font-size:clamp(16.5px,1.35vw,19.5px);
             line-height:1.58; max-width:62ch; color:var(--body); }
.cta{ display:flex; flex-wrap:wrap; gap:12px; margin-top:clamp(24px,3.4vw,36px); }
.btn{ display:inline-block; font-size:15px; font-weight:500; line-height:1.2;
      padding:13px 24px; border-radius:2px; border:1px solid var(--ink);
      color:var(--ink); text-align:center; }
.btn:hover{ border-color:var(--blue); color:var(--blue); text-decoration:none; }
.btn.solid{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
.btn.solid:hover{ background:var(--blue); border-color:var(--blue); color:#fff; }

/* ---------- figures ---------- */
.figs{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr)); }
.fig{ padding:clamp(24px,3.2vw,34px) clamp(18px,2.2vw,28px);
      border-inline-end:1px solid var(--rule); }
.fig:last-child{ border-inline-end:none; }
.fig .v{ font-family:var(--display); font-size:clamp(36px,3.6vw,48px); line-height:1;
         color:var(--ink); font-variant-numeric:tabular-nums; }
.fig .k{ font-size:clamp(13px,1.05vw,14px); color:var(--mute); margin-top:12px; line-height:1.45; }
.figs-note{ padding:0 clamp(18px,2.2vw,28px) clamp(24px,3vw,32px);
            font-family:var(--mono); font-size:12px; color:var(--faint); }

/* ---------- sections ---------- */
section{ padding-block:var(--sec-y); }
.sec-head{ display:grid; grid-template-columns:var(--label-col) minmax(0,1fr);
           gap:clamp(18px,3vw,36px); align-items:start; }
.sec-head h2{ font-family:var(--display); font-weight:400;
              font-size:clamp(27px,3.7vw,42px); line-height:1.11; letter-spacing:-.008em;
              max-width:24ch; }
.sec-head .intro{ margin-top:14px; font-size:clamp(15.5px,1.15vw,17px); max-width:60ch; }

.three{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));
        gap:1px; background:var(--rule); border:1px solid var(--rule);
        margin-top:clamp(30px,4vw,46px); }
.three > div{ background:var(--card); padding:clamp(22px,2.6vw,30px) clamp(20px,2.2vw,28px); }
.three h3{ font-size:clamp(16px,1.3vw,18px); font-weight:600; letter-spacing:-.01em; line-height:1.3; }
.three p{ margin-top:12px; font-size:clamp(14px,1.08vw,15px); line-height:1.6; color:var(--mute); }

/* ---------- work ---------- */
.work{ margin-top:clamp(30px,4vw,46px); }
.case{ display:grid; grid-template-columns:var(--label-col) minmax(0,1fr);
       gap:clamp(18px,3vw,36px); padding-block:clamp(26px,3.4vw,38px);
       border-top:1px solid var(--rule); }
.case:last-child{ border-bottom:1px solid var(--rule); }
.case .tag{ font-family:var(--mono); font-size:10.5px; letter-spacing:.13em;
            text-transform:uppercase; color:var(--faint); padding-top:6px; }
.case h3{ font-size:clamp(18px,1.7vw,22px); font-weight:600; letter-spacing:-.015em; line-height:1.25; }
.rows{ margin-top:16px; display:grid; gap:12px; }
.row{ display:grid; grid-template-columns:96px minmax(0,1fr); gap:18px; align-items:start; margin:0; }
.row dt{ font-family:var(--mono); font-size:10.5px; letter-spacing:.11em;
         text-transform:uppercase; color:var(--faint); padding-top:5px; }
.row dd{ margin:0; font-size:clamp(14.5px,1.12vw,15.5px); line-height:1.58; }
.row dd.out{ color:var(--ink); }

/* ---------- built ---------- */
.built{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));
        gap:1px; background:var(--rule); border:1px solid var(--rule);
        margin-top:clamp(30px,4vw,46px); }
.built > div{ background:var(--card); padding:clamp(22px,2.4vw,28px) clamp(20px,2.2vw,26px);
              display:flex; flex-direction:column; }
.built .nm{ font-size:clamp(16px,1.3vw,18px); font-weight:600; color:var(--ink); letter-spacing:-.01em; }
.built .sub{ font-family:var(--mono); font-size:10.5px; letter-spacing:.11em;
             text-transform:uppercase; color:var(--blue); margin-top:8px; }
.built p{ margin-top:14px; font-size:clamp(14px,1.08vw,15px); line-height:1.6; color:var(--mute); }

/* ---------- stack ---------- */
.stack{ margin-top:clamp(30px,4vw,46px); border-top:1px solid var(--rule); }
.srow{ display:grid; grid-template-columns:clamp(150px,18vw,210px) minmax(0,1fr);
       gap:clamp(14px,3vw,36px); padding-block:clamp(18px,2.2vw,24px);
       border-bottom:1px solid var(--rule); }
.srow .h{ font-family:var(--mono); font-size:11px; letter-spacing:.13em; text-transform:uppercase;
          color:var(--ink); font-weight:500; padding-top:4px; }
.srow .l{ font-size:clamp(14.5px,1.12vw,15.5px); line-height:1.72; color:var(--mute); }

/* ---------- close ---------- */
.close{ padding-block:clamp(54px,7vw,80px) clamp(32px,4vw,44px); }
.close h2{ font-family:var(--display); font-weight:400;
           font-size:clamp(29px,4.8vw,52px); line-height:1.1; letter-spacing:-.012em;
           max-width:21ch; margin-top:14px; }
.close p{ margin-top:22px; font-size:clamp(16px,1.25vw,17.5px); max-width:56ch; }
.contact{ margin-top:clamp(26px,3.4vw,36px); display:flex; flex-wrap:wrap;
          gap:12px clamp(20px,3vw,32px); font-family:var(--mono);
          font-size:clamp(13px,1.05vw,14.5px); }
footer{ border-top:1px solid var(--rule); padding-block:22px clamp(34px,5vw,48px);
        font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase;
        color:var(--faint); display:flex; flex-wrap:wrap; gap:8px 18px;
        justify-content:space-between; }

/* ---------- site header ---------- */
html{ scroll-padding-top:72px; }
.site-head{ position:sticky; top:0; z-index:50; background:var(--paper); background:color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter:saturate(1.2) blur(10px); -webkit-backdrop-filter:saturate(1.2) blur(10px); border-bottom:1px solid var(--rule); }
.sh-row{ display:flex; align-items:center; gap:clamp(14px,2.4vw,32px); min-height:64px; }
.sh-brand{ display:flex; align-items:center; gap:10px; color:var(--ink); font-family:var(--mono); font-size:11.5px; letter-spacing:.09em; text-transform:uppercase; font-weight:500; white-space:nowrap; }
.sh-brand:hover{ text-decoration:none; color:var(--blue); }
.sh-brand img{ width:26px; height:26px; border-radius:6px; }
.sh-brand em{ font-style:normal; color:var(--mute); font-weight:400; margin-left:4px; }
.sh-nav{ display:flex; align-items:center; gap:clamp(4px,1vw,10px); margin-left:auto; }
.sh-item{ position:relative; }
.sh-item > a{ display:block; padding:10px 12px; font-family:var(--mono); font-size:11.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--mute); border-radius:2px; }
.sh-item > a:hover,.sh-item > a.on{ color:var(--ink); text-decoration:none; }
.sh-item > a.on{ box-shadow:inset 0 -2px 0 var(--blue); }
.sh-sub{ position:absolute; left:0; top:100%; min-width:230px; padding:8px; background:var(--card); border:1px solid var(--rule); box-shadow:0 12px 30px rgba(0,0,0,.08); display:none; z-index:60; }
.sh-item:hover .sh-sub,.sh-item:focus-within .sh-sub{ display:grid; }
.sh-sub a{ display:block; padding:9px 10px; font-size:14px; color:var(--body); border-radius:2px; }
.sh-sub a:hover{ background:var(--blue-soft); color:var(--ink); text-decoration:none; }
.sh-cta{ margin-left:8px; font-size:13.5px; font-weight:500; padding:9px 14px; border:1px solid var(--ink); color:var(--ink); border-radius:2px; white-space:nowrap; }
.sh-cta:hover{ background:var(--ink); color:var(--paper); text-decoration:none; }
.sh-burger{ display:none; margin-left:auto; width:44px; height:44px; border:1px solid var(--rule2); background:var(--card); border-radius:2px; cursor:pointer; padding:0; flex-direction:column; align-items:center; justify-content:center; gap:5px; }
.sh-burger span{ display:block; width:20px; height:2px; background:var(--ink); transition:transform .18s, opacity .18s; }
.sh-burger[aria-expanded="true"] span:nth-child(1){ transform:translateY(7px) rotate(45deg); }
.sh-burger[aria-expanded="true"] span:nth-child(2){ opacity:0; }
.sh-burger[aria-expanded="true"] span:nth-child(3){ transform:translateY(-7px) rotate(-45deg); }
.drawer{ border-top:1px solid var(--rule); background:var(--paper); max-height:calc(100vh - 64px); overflow:auto; }
.drawer .wrap{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr)); gap:clamp(18px,3vw,36px); padding-block:clamp(22px,3vw,34px); }
.dr-group{ display:grid; gap:4px; align-content:start; }
.dr-group .sec-label{ margin-bottom:6px; }
.dr-group a{ font-size:16px; padding:8px 0; color:var(--ink); border-bottom:1px solid var(--rule); }
.dr-group a:hover{ color:var(--blue); text-decoration:none; }
.dr-foot{ grid-column:1/-1; display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--blue); }
html.nav-open{ overflow:hidden; }
@media (max-width:1000px){ .sh-brand em{ display:none; } }
@media (max-width:860px){ .sh-nav{ display:none; } .sh-burger{ display:flex; } .sh-row{ min-height:60px; } html{ scroll-padding-top:68px; } }
@media print{ .site-head{ display:none !important; } }

/* ---------- masthead nav ---------- */
.mnav{ display:inline-flex; gap:clamp(12px,2vw,22px); }
.mnav a{ color:var(--mute); } .mnav a:hover,.mnav a.on{ color:var(--ink); text-decoration:none; }

/* ---------- method callout (home) ---------- */
.method-callout{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px clamp(18px,3vw,36px); align-items:center;
  padding:clamp(22px,3vw,34px) clamp(20px,2.6vw,32px); margin-block:clamp(26px,3.4vw,40px); border:1px solid var(--ink); background:var(--card); color:var(--body); }
.method-callout:hover{ text-decoration:none; border-color:var(--blue); }
.method-callout .eyebrow{ grid-column:1/-1; }
.method-callout .mc-title{ font-family:var(--display); font-size:clamp(24px,3vw,34px); line-height:1.12; color:var(--ink); letter-spacing:-.008em; }
.method-callout .mc-sub{ grid-column:1; font-size:clamp(14.5px,1.1vw,15.5px); line-height:1.55; color:var(--mute); max-width:60ch; }
.method-callout .mc-go{ grid-column:2; grid-row:2/4; font-family:var(--mono); font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--blue); white-space:nowrap; }
@media (max-width:620px){ .method-callout{ grid-template-columns:1fr; } .method-callout .mc-go{ grid-column:1; grid-row:auto; } }

/* ---------- SHAMS strip ---------- */
.shams{ list-style:none; margin:clamp(26px,3.4vw,40px) 0 0; padding:0; display:grid; grid-template-columns:repeat(5,1fr); gap:1px; background:var(--rule); border:1px solid var(--rule); }
.shams li{ background:var(--card); padding:clamp(18px,2.2vw,26px) clamp(16px,2vw,22px); display:grid; gap:8px; align-content:start; min-width:0; }
.shams b{ font-family:var(--display); font-weight:400; font-size:clamp(44px,5vw,64px); line-height:.9; color:var(--blue); }
.shams .sh-t{ font-size:clamp(16px,1.3vw,18px); font-weight:600; letter-spacing:-.01em; color:var(--ink); }
.shams .sh-d{ font-size:clamp(13.5px,1.05vw,14.5px); line-height:1.55; color:var(--mute); }
.shams .sh-g{ font-family:var(--mono); font-size:10.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--faint); margin-top:4px; }
.shams-note{ margin:16px 0 clamp(30px,4vw,48px); font-size:14.5px; color:var(--mute); }

/* ---------- map ---------- */
.ind{ display:flex; flex-wrap:wrap; gap:8px; margin-top:clamp(22px,3vw,34px); }
.ind button{ font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; padding:9px 14px; border:1px solid var(--rule2); background:var(--card); color:var(--mute); border-radius:2px; cursor:pointer; }
.ind button:hover{ border-color:var(--ink); color:var(--ink); }
.ind button.on{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
.mapwrap{ display:grid; grid-template-columns:minmax(0,1.45fr) minmax(300px,1fr); gap:1px; background:var(--rule); border:1px solid var(--rule); margin-top:18px; }
.mapstage{ background:var(--card); padding:clamp(10px,1.5vw,18px); min-width:0; }
.mapstage svg{ width:100%; height:auto; display:block; touch-action:none; user-select:none; }
.legend{ display:flex; flex-wrap:wrap; gap:8px 18px; padding:10px 6px 2px; font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); }
.legend i{ display:inline-block; width:11px; height:11px; border-radius:50%; margin-right:7px; vertical-align:-1px; }
.lg-layer{ background:var(--ink); } .lg-zone{ background:var(--blue); } .lg-risk{ background:transparent; border:2px solid #C8372D; }
.m-ring{ fill:none; stroke:var(--rule); stroke-dasharray:3 6; }
.m-core circle{ fill:var(--sunk); stroke:var(--rule2); }
.m-core text{ font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; fill:var(--mute); }
.m-line{ stroke:var(--rule2); opacity:.7; transition:opacity .15s, stroke .15s; }
.m-line.on{ stroke:var(--blue); opacity:1; } .m-line.dim{ opacity:.12; }
.m-node{ cursor:grab; transition:opacity .15s; outline:none; } .m-node:active{ cursor:grabbing; } .m-node.dim{ opacity:.25; }
.m-node:focus-visible .m-disc{ stroke:var(--blue); stroke-width:3; }
.m-layer .m-disc{ fill:var(--card); stroke:var(--ink); stroke-width:1.5; }
.m-zone .m-disc{ fill:var(--blue); stroke:var(--blue); }
.m-risk{ fill:none; stroke:transparent; stroke-width:2; } .m-risk.hi{ stroke:#C8372D; } .m-risk.mid{ stroke:#D4AF56; }
.m-node.sel .m-disc{ stroke:var(--ink); stroke-width:3; } .m-zone.sel .m-disc{ stroke:var(--ink); }
.m-ic{ font-family:var(--mono); font-size:12px; font-weight:500; fill:var(--ink); pointer-events:none; }
.m-zone .m-ic{ fill:#fff; }
.m-lab{ font-family:var(--sans); font-size:13px; font-weight:500; fill:var(--ink); pointer-events:none; }
.panel{ background:var(--card); padding:clamp(18px,2.2vw,26px); min-width:0; max-height:760px; overflow:auto; }
.panel .p-k{ font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--blue); }
.panel h3{ font-family:var(--display); font-weight:400; font-size:clamp(24px,2.4vw,30px); line-height:1.1; margin-top:6px; color:var(--ink); }
.panel .p-what{ margin-top:8px; font-size:15px; line-height:1.55; color:var(--ink); }
.panel h4{ font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); font-weight:500; margin-top:18px; }
.panel p,.panel li{ font-size:14px; line-height:1.55; color:var(--body); }
.panel p{ margin-top:6px; } .panel ul{ margin:6px 0 0; padding-left:18px; display:grid; gap:5px; }
.panel .lv{ margin:6px 0 0; padding:0; list-style:none; display:grid; gap:5px; } .panel .lv li{ display:grid; grid-template-columns:28px 1fr; gap:8px; }
.panel .lv b{ font-family:var(--mono); font-weight:500; color:var(--blue); font-size:12px; padding-top:2px; }
