<style>
/* ---------- tokens ---------- */
:root{
  --paper:#F7F7F5; --card:#FFFFFF; --sunk:#EFEFEC;
  --ink:#0E1012; --body:#3E4449; --mute:#6B737A; --faint:#939BA2;
  --rule:#E0E0DB; --rule2:#C6C6BF;
  --blue:#1F45C8; --blue-soft:#E7EBFB;
  --gold:#B8912F; --gold-ink:#86661A; --gold-soft:#F6EED9;
  --display:'Instrument Serif',Georgia,'Times New Roman',serif;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;

  --wrap:1680px;                      /* fluid: the page fills the screen up to this */
  --pad:clamp(16px,4vw,72px);
  --gap:clamp(16px,2.2vw,22px);
  --sec-y:clamp(52px,7vw,84px);
  --label-col:clamp(110px,12vw,190px);
  --measure:66ch;                     /* readable width for running text inside wide layouts */
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0D0F11; --card:#14171A; --sunk:#101315;
    --ink:#F1F2F1; --body:#B9C0C5; --mute:#8E969D; --faint:#6B737A;
    --rule:#232830; --rule2:#343B45;
    --blue:#8FA6FF; --blue-soft:#161C33;
    --gold:#D4AF56; --gold-ink:#DDBB66; --gold-soft:#2A2312;
  }
}
:root[data-theme="dark"]{
  --paper:#0D0F11; --card:#14171A; --sunk:#101315;
  --ink:#F1F2F1; --body:#B9C0C5; --mute:#8E969D; --faint:#6B737A;
  --rule:#232830; --rule2:#343B45;
  --blue:#8FA6FF; --blue-soft:#161C33;
    --gold:#D4AF56; --gold-ink:#DDBB66; --gold-soft:#2A2312;
}

/* ---------- base ---------- */
*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{
  margin:0; background:var(--paper); color:var(--body);
  font-family:var(--sans); font-weight:300;
  font-size:clamp(15.5px,1.05vw,17px); line-height:1.62;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overflow-wrap:break-word;
}
h1,h2,h3,h4{ margin:0; color:var(--ink); text-wrap:balance; }
p{ margin:0; }
a{ color:var(--blue); text-decoration:none; }
a:hover{ text-decoration:underline; text-underline-offset:3px; }
a:focus-visible,button:focus-visible{ outline:2px solid var(--blue); outline-offset:3px; border-radius:2px; }
img{ max-width:100%; height:auto; }
::selection{ background:var(--blue); color:#fff; }

.wrap{ width:100%; max-width:var(--wrap); margin-inline:auto; padding-inline:var(--pad); }
.band{ border-top:1px solid var(--rule); }
.eyebrow{ font-family:var(--mono); font-size:clamp(10px,1.05vw,11.5px); letter-spacing:.15em;
          text-transform:uppercase; color:var(--blue); font-weight:500; }
.sec-label{ font-family:var(--mono); font-size:11px; letter-spacing:.15em;
            text-transform:uppercase; color:var(--faint); }

/* ---------- masthead ---------- */
.mast{ display:flex; flex-wrap:wrap; gap:10px clamp(16px,3vw,34px); align-items:baseline;
       padding-block:22px; font-family:var(--mono);
       font-size:clamp(10px,1.05vw,11.5px); letter-spacing:.09em;
       text-transform:uppercase; color:var(--mute); }
.mast .nm{ color:var(--ink); font-weight:500; }
.mast .mark{ width:24px; height:24px; border-radius:6px; vertical-align:-7px; margin-inline-end:9px; }
.mast .avail{ display:inline-flex; align-items:center; gap:8px; color:var(--blue);
              margin-inline-start:auto; }
.dot{ width:6px; height:6px; border-radius:50%; background:var(--blue); flex:none; }

/* ---------- hero ---------- */
.hero{ padding-block:clamp(40px,6.5vw,62px) clamp(48px,7vw,70px); }
.hero h1{
  font-family:var(--display); font-weight:400; font-style:normal;
  font-size:clamp(38px,7.6vw,88px); line-height:1.03; letter-spacing:-.017em;
  max-width:18ch; margin-top:clamp(14px,2vw,20px);
}
.hero h1 em{ font-style:italic; color:var(--blue); }
.hero .lede{ margin-top:clamp(20px,3vw,30px); font-size:clamp(16.5px,1.3vw,19.5px);
             line-height:1.58; max-width:var(--measure); color:var(--body); }
/* desktop: the headline takes the left column, the lede, note and actions stack on the right, so the hero uses the width */
@media (min-width:1100px){
  .hero{ display:grid; grid-template-columns:minmax(0,7fr) minmax(0,5fr); column-gap:clamp(40px,5vw,110px); align-items:start; }
  .hero > *{ grid-column:1; }
  .hero .eyebrow{ grid-column:1/-1; }
  .hero h1{ grid-row:2 / span 4; max-width:none; font-size:clamp(56px,5.6vw,104px); }
  .hero .lede{ grid-column:2; grid-row:2; margin-top:clamp(10px,1.4vw,22px); }
  .hero .hero-note{ grid-column:2; grid-row:3; }
  .hero .cta{ grid-column:2; grid-row:4; }
  .hero .pq-hero{ grid-column:1/-1; }
}
.cta{ display:flex; flex-wrap:wrap; gap:12px; margin-top:clamp(24px,3.4vw,36px); }
.btn{ display:inline-block; font-size:15px; font-weight:500; line-height:1.2;
      padding:13px 24px; border-radius:2px; border:1px solid var(--ink);
      color:var(--ink); text-align:center; }
.btn:hover{ border-color:var(--blue); color:var(--blue); text-decoration:none; }
.btn.solid{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
.btn.solid:hover{ background:var(--blue); border-color:var(--blue); color:#fff; }

/* ---------- figures ---------- */
.figs{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr)); }
.fig{ padding:clamp(24px,3.2vw,34px) clamp(18px,2.2vw,28px);
      border-inline-end:1px solid var(--rule); }
.fig:last-child{ border-inline-end:none; }
.fig .v{ font-family:var(--display); font-size:clamp(36px,3.6vw,48px); line-height:1;
         color:var(--ink); font-variant-numeric:tabular-nums; }
.fig .k{ font-size:clamp(13px,1.05vw,14px); color:var(--mute); margin-top:12px; line-height:1.45; }
.figs-note{ padding:0 clamp(18px,2.2vw,28px) clamp(24px,3vw,32px);
            font-family:var(--mono); font-size:12px; color:var(--faint); }

/* ---------- sections ---------- */
section{ padding-block:var(--sec-y); }
.sec-head{ display:grid; grid-template-columns:var(--label-col) minmax(0,1fr);
           gap:clamp(18px,3vw,36px); align-items:start; }
.sec-head h2{ font-family:var(--display); font-weight:400;
              font-size:clamp(27px,3.7vw,42px); line-height:1.11; letter-spacing:-.008em;
              max-width:24ch; }
.sec-head .intro{ margin-top:14px; font-size:clamp(15.5px,1.15vw,17px); max-width:var(--measure); }
@media (min-width:1100px){
  .sec-head > div{ display:grid; grid-template-columns:minmax(0,11fr) minmax(0,9fr); column-gap:clamp(32px,4vw,80px); align-items:start; }
  .sec-head > div > *{ grid-column:1/-1; }
  .sec-head > div > h2{ grid-column:1; max-width:none; }
  .sec-head > div > .intro{ grid-column:2; grid-row:1; margin-top:8px; }
}

.three{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));
        gap:1px; background:var(--rule); border:1px solid var(--rule);
        margin-top:clamp(30px,4vw,46px); }
.three > div{ background:var(--card); padding:clamp(22px,2.6vw,30px) clamp(20px,2.2vw,28px); }
.three h3{ font-size:clamp(16px,1.3vw,18px); font-weight:600; letter-spacing:-.01em; line-height:1.3; }
.three p{ margin-top:12px; font-size:clamp(14px,1.08vw,15px); line-height:1.6; color:var(--mute); }

/* ---------- work ---------- */
.work{ margin-top:clamp(30px,4vw,46px); }
.case{ display:grid; grid-template-columns:var(--label-col) minmax(0,1fr);
       gap:clamp(18px,3vw,36px); padding-block:clamp(26px,3.4vw,38px);
       border-top:1px solid var(--rule); }
.case:last-child{ border-bottom:1px solid var(--rule); }
.case .tag{ font-family:var(--mono); font-size:10.5px; letter-spacing:.13em;
            text-transform:uppercase; color:var(--faint); padding-top:6px; }
.case h3{ font-size:clamp(18px,1.7vw,22px); font-weight:600; letter-spacing:-.015em; line-height:1.25; }
.rows{ margin-top:16px; display:grid; gap:12px; }
.row{ display:grid; grid-template-columns:96px minmax(0,1fr); gap:18px; align-items:start; margin:0; }
.row dt{ font-family:var(--mono); font-size:10.5px; letter-spacing:.11em;
         text-transform:uppercase; color:var(--faint); padding-top:5px; }
.row dd{ margin:0; font-size:clamp(14.5px,1.12vw,15.5px); line-height:1.58; }
.row dd.out{ color:var(--ink); }

/* ---------- built ---------- */
.built{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));
        gap:1px; background:var(--rule); border:1px solid var(--rule);
        margin-top:clamp(30px,4vw,46px); }
.built > div{ background:var(--card); padding:clamp(22px,2.4vw,28px) clamp(20px,2.2vw,26px);
              display:flex; flex-direction:column; }
.built .nm{ font-size:clamp(16px,1.3vw,18px); font-weight:600; color:var(--ink); letter-spacing:-.01em; }
.built .sub{ font-family:var(--mono); font-size:10.5px; letter-spacing:.11em;
             text-transform:uppercase; color:var(--blue); margin-top:8px; }
.built p{ margin-top:14px; font-size:clamp(14px,1.08vw,15px); line-height:1.6; color:var(--mute); }

/* ---------- stack ---------- */
.stack{ margin-top:clamp(30px,4vw,46px); border-top:1px solid var(--rule); }
.srow{ display:grid; grid-template-columns:clamp(150px,18vw,210px) minmax(0,1fr);
       gap:clamp(14px,3vw,36px); padding-block:clamp(18px,2.2vw,24px);
       border-bottom:1px solid var(--rule); }
.srow .h{ font-family:var(--mono); font-size:11px; letter-spacing:.13em; text-transform:uppercase;
          color:var(--ink); font-weight:500; padding-top:4px; }
.srow .l{ font-size:clamp(14.5px,1.12vw,15.5px); line-height:1.72; color:var(--mute); }

/* ---------- close ---------- */
.close{ padding-block:clamp(54px,7vw,80px) clamp(32px,4vw,44px); }
.close h2{ font-family:var(--display); font-weight:400;
           font-size:clamp(29px,4.8vw,52px); line-height:1.1; letter-spacing:-.012em;
           max-width:21ch; margin-top:14px; }
.close p{ margin-top:22px; font-size:clamp(16px,1.25vw,17.5px); max-width:var(--measure); }
.contact{ margin-top:clamp(26px,3.4vw,36px); display:flex; flex-wrap:wrap;
          gap:12px clamp(20px,3vw,32px); font-family:var(--mono);
          font-size:clamp(13px,1.05vw,14.5px); }
footer{ border-top:1px solid var(--rule); padding-block:22px clamp(34px,5vw,48px);
        font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase;
        color:var(--faint); display:flex; flex-wrap:wrap; gap:8px 18px;
        justify-content:space-between; }


/* ---------- page navigation: a sticky list of the sections on long pages ---------- */
.pagenav{ position:sticky; top:64px; z-index:40; background:color-mix(in srgb, var(--paper) 94%, transparent); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); }
.pagenav-row{ display:flex; align-items:center; gap:4px clamp(8px,1.2vw,18px); overflow-x:auto; scrollbar-width:none; padding-block:0; min-height:42px; -webkit-overflow-scrolling:touch; }
.pagenav-row::-webkit-scrollbar{ display:none; }
.pagenav-l{ font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); flex:none; margin-right:6px; }
.pagenav a{ flex:none; font-family:var(--mono); font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--mute); padding:12px 2px; border-bottom:2px solid transparent; }
.pagenav a:hover{ color:var(--ink); text-decoration:none; }
.pagenav a.on{ color:var(--blue); border-bottom-color:var(--blue); }
@media (max-width:860px){ .pagenav{ top:60px; } }
@media print{ .pagenav{ display:none; } }

/* ---------- start here: three doors ---------- */
.doors{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr)); gap:1px; background:var(--rule); border:1px solid var(--rule); margin-top:clamp(28px,3.6vw,44px); }
.door{ background:var(--card); padding:clamp(22px,2.6vw,32px) clamp(20px,2.4vw,30px); display:flex; flex-direction:column; gap:12px; min-width:0; }
.door-new{ background:var(--blue-soft); }
.door h3{ font-family:var(--display); font-weight:400; font-size:clamp(26px,2.4vw,32px); line-height:1.1; letter-spacing:-.01em; }
.door-sub{ font-size:clamp(14.5px,1.1vw,15.5px); line-height:1.6; color:var(--body); max-width:48ch; }
.door-cta{ margin-top:auto; padding-top:10px; display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; }
.door-prog{ font-family:var(--mono); font-size:11.5px; letter-spacing:.06em; color:var(--mute); }
.door-paths{ list-style:none; margin:4px 0 0; padding:0; display:grid; gap:1px; background:var(--rule); border:1px solid var(--rule); }
.door-paths li a{ display:grid; grid-template-columns:28px minmax(0,1fr) auto; grid-template-rows:auto auto; gap:2px 10px; align-items:center; padding:10px 12px; background:var(--card); color:var(--ink); text-decoration:none; }
.door-paths li a:hover{ background:var(--paper); }
.dp-n{ grid-row:1/3; font-family:var(--display); font-size:22px; color:var(--blue); line-height:1; }
.dp-t{ font-size:14.5px; font-weight:500; }
.dp-m{ font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; color:var(--faint); }
.dp-bar{ grid-column:2/4; height:3px; background:var(--rule2); border-radius:2px; overflow:hidden; }
.dp-bar i{ display:block; height:100%; width:0; background:var(--blue); transition:width .3s; }
.door-paths li.is-done .dp-n{ color:var(--mute); } .door-paths li.is-done .dp-bar i{ background:var(--mute); }
.home-start .doors{ margin-top:clamp(22px,3vw,34px); }

/* ---------- a path page ---------- */
.path-meta p{ font-size:14px; line-height:1.6; color:var(--body); }
.path-meta .sec-label{ color:var(--blue); }
.path-track{ margin-top:10px; height:4px; background:var(--rule2); border-radius:2px; overflow:hidden; }
.path-track i{ display:block; height:100%; width:0; background:var(--blue); transition:width .3s; }
.path-stops{ list-style:none; margin:clamp(28px,3.6vw,44px) 0 0; padding:0; display:grid; gap:1px; background:var(--rule); border:1px solid var(--rule); }
.ps{ display:grid; grid-template-columns:52px minmax(0,1fr) auto 28px; gap:0 14px; align-items:center; background:var(--card); padding:14px clamp(14px,2vw,22px); }
.ps-n{ font-family:var(--display); font-size:26px; line-height:1; color:var(--blue); }
.ps-a{ color:var(--ink); text-decoration:none; display:grid; gap:3px; min-width:0; }
.ps-a b{ font-size:clamp(15.5px,1.2vw,17px); font-weight:500; } .ps-a small{ font-size:13.5px; color:var(--mute); line-height:1.5; }
.ps-a:hover b{ color:var(--blue); }
.ps-k{ font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); white-space:nowrap; }
.ps-st{ width:20px; height:20px; border:1.5px solid var(--rule2); border-radius:50%; justify-self:end; position:relative; }
.ps.done .ps-st{ border-color:var(--blue); background:var(--blue); }
.ps.done .ps-st::after{ content:""; position:absolute; left:6px; top:2.5px; width:5px; height:10px; border-right:2px solid #fff; border-bottom:2px solid #fff; transform:rotate(45deg); }
.ps.done .ps-n{ color:var(--mute); }
.ps[aria-current="step"]{ box-shadow:inset 3px 0 0 var(--blue); }
@media (max-width:620px){ .ps{ grid-template-columns:36px minmax(0,1fr) 24px; } .ps-k{ display:none; } .ps-n{ font-size:20px; } }
.path-nav{ margin-top:clamp(24px,3vw,36px); display:flex; flex-wrap:wrap; gap:10px; }

/* ---------- an idea page ---------- */
.idea-depths{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr)); gap:1px; background:var(--rule); border:1px solid var(--rule); }
.idea-depth{ background:var(--card); padding:clamp(20px,2.4vw,30px) clamp(18px,2.2vw,28px); }
.idea-depth p:not(.sec-label){ margin-top:10px; font-size:clamp(15.5px,1.2vw,17px); line-height:1.62; color:var(--body); }
.idea-depth:first-child p:not(.sec-label){ font-family:var(--display); font-size:clamp(20px,1.8vw,25px); line-height:1.3; color:var(--ink); }
.idea-rel{ margin-top:clamp(22px,3vw,34px); display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr)); gap:clamp(18px,3vw,36px); }
.idea-rel .chips{ margin-top:8px; } .chip-none{ color:var(--faint); }
.idea-path{ margin-top:8px; font-size:14.5px; }
a.chip{ text-decoration:none; } a.chip:hover{ border-color:var(--ink); }
.idea-hero h1{ font-size:clamp(44px,5.2vw,92px); }

/* ---------- the path bar ---------- */
.pathbar{ position:fixed; left:0; right:0; bottom:0; z-index:95; display:flex; flex-wrap:wrap; align-items:center; gap:6px clamp(12px,2vw,24px); padding:10px clamp(14px,3vw,28px) calc(10px + env(safe-area-inset-bottom,0px)); background:var(--ink); color:var(--paper); font-size:13.5px; box-shadow:0 -8px 30px rgba(0,0,0,.2); }
.pathbar a{ color:var(--paper); } .pathbar a:hover{ color:#fff; }
.pb-title b{ font-family:var(--mono); font-weight:500; letter-spacing:.08em; text-transform:uppercase; font-size:11px; margin-right:8px; color:var(--gold); }
.pb-pos{ font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; opacity:.75; }
.pb-nav{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:34ch; }
.pb-next{ margin-left:auto; font-weight:500; }
.pb-x{ all:unset; cursor:pointer; font-size:20px; line-height:1; padding:0 4px; opacity:.7; } .pb-x:hover{ opacity:1; }
body.has-pathbar{ padding-bottom:64px; }
@media (max-width:620px){ .pathbar{ font-size:12.5px; } .pb-nav:not(.pb-next){ display:none; } .pb-next{ max-width:60vw; } }

/* ---------- the architect route ---------- */
.routes{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr)); gap:1px; background:var(--rule); border:1px solid var(--rule); margin-top:clamp(28px,3.6vw,44px); }
.route{ background:var(--card); padding:clamp(22px,2.6vw,32px) clamp(20px,2.4vw,30px); min-width:0; scroll-margin-top:120px; }
.route h3{ font-family:var(--display); font-weight:400; font-size:clamp(24px,2.2vw,30px); line-height:1.12; letter-spacing:-.01em; }
.route-when{ margin-top:10px; font-size:14.5px; line-height:1.6; color:var(--mute); }
.route-meta{ margin-top:12px; display:flex; flex-wrap:wrap; gap:6px; }
.chip-b{ background:var(--blue-soft); border-color:var(--blue); color:var(--blue); }
.rt-steps{ list-style:none; margin:18px 0 0; padding:0; border-top:1px solid var(--rule); }

/* ---------- site header ---------- */
html{ scroll-padding-top:72px; }
.site-head{ position:sticky; top:0; z-index:50; background:var(--paper); background:color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter:saturate(1.2) blur(10px); -webkit-backdrop-filter:saturate(1.2) blur(10px); border-bottom:1px solid var(--rule); }

.mapwrap{ display:grid; grid-template-columns:minmax(0,1.45fr) minmax(300px,1fr); gap:1px; background:var(--rule); border:1px solid var(--rule); margin-top:18px; }

.m-ic{ font-family:var(--mono); font-size:12px; font-weight:500; fill:var(--ink); pointer-events:none; }

.panel{ background:var(--card); padding:clamp(18px,2.2vw,26px); min-width:0; max-height:760px; overflow:auto; }

.prose h2{ font-size:1.25em; } .prose h3{ font-size:1.05em; }
.prose code{ font-family:var(--mono); font-size:.88em; background:var(--sunk); padding:2px 5px; border-radius:2px; }
.article .after{ margin-top:clamp(32px,4vw,44px); padding-top:22px; border-top:1px solid var(--rule);
                 display:flex; gap:14px 28px; flex-wrap:wrap; font-family:var(--mono); font-size:12.5px; letter-spacing:.05em; }
.list{ margin-top:clamp(26px,3.4vw,38px); border-top:1px solid var(--rule); }
.list .item{ display:grid; grid-template-columns:130px minmax(0,1fr); gap:20px; padding:20px 0; border-bottom:1px solid var(--rule); }
.list .item .d{ font-family:var(--mono); font-size:11.5px; letter-spacing:.08em; color:var(--faint); padding-top:5px; }
.list .item h3{ font-size:clamp(17px,1.45vw,20px); font-weight:600; letter-spacing:-.012em; line-height:1.3; }
.list .item h3 a{ color:var(--ink); } .list .item h3 a:hover{ color:var(--blue); text-decoration:none; }
.list .item p{ margin-top:6px; font-size:14.5px; color:var(--mute); line-height:1.58; }
@media (max-width:620px){ .list .item{ grid-template-columns:1fr; gap:6px; } }

/* ---------- tools ---------- */
.tl-hero h1{ max-width:none; }
.tl-hero .crumbs{ font-family:var(--mono); font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); margin-bottom:18px; }
.tl-hero .crumbs a{ color:var(--mute); }
.tl-hero .btn{ cursor:pointer; font-family:var(--sans); background:transparent; }
.tl-hero .btn.solid{ background:var(--ink); }
.tl-inst{ margin-top:clamp(26px,3.4vw,40px); display:grid; grid-template-columns:minmax(0,1fr) 360px; background:var(--card); border:1px solid var(--rule); }
.tl-ed{ min-width:0; display:flex; flex-direction:column; }
.tl-bar{ display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--rule); }
.tl-field{ display:inline-flex; align-items:center; gap:8px; font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--mute); }
.tl-in,.tl-sel{ font-family:var(--sans); font-size:14.5px; font-weight:400; color:var(--ink); background:var(--paper); border:1px solid var(--rule2); border-radius:2px; padding:8px 10px; min-width:0; width:100%; }
.tl-field .tl-in,.tl-field .tl-sel{ width:auto; }
.tl-in:focus,.tl-sel:focus{ outline:2px solid var(--blue); outline-offset:-1px; border-color:var(--blue); }
.tl-num{ font-family:var(--mono); font-size:14px; font-variant-numeric:tabular-nums; text-align:right; }
.tl-field .tl-num{ width:96px; }
.tl-head,.tl-row{ display:grid; grid-template-columns:minmax(0,1fr) 104px 76px 104px 36px; gap:8px; align-items:center; padding:8px 16px; }
.tl-rs .tl-head,.tl-rs .tl-row{ grid-template-columns:minmax(0,1fr) 92px 86px 70px 36px; }
.tl-head{ font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); padding-top:12px; padding-bottom:4px; }
.tl-row{ border-top:1px solid var(--rule); }
.tl-head + div > .tl-row:first-child{ border-top:none; }
.tl-row.soft .tl-in:not(.tl-num){ color:var(--mute); }
.tl-row.par{ background:var(--sunk); }
.tl-cell{ display:block; min-width:0; margin:0; }
.tl-lab{ position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden; }
.tl-chk{ display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer; min-height:36px; }
.tl-chk input{ width:18px; height:18px; margin:0; accent-color:var(--blue); cursor:pointer; }
.tl-x{ width:36px; height:36px; display:flex; align-items:center; justify-content:center; padding:0; border:1px solid var(--rule); background:transparent; color:var(--mute); border-radius:2px; cursor:pointer; font-family:var(--sans); font-size:20px; line-height:1; }
.tl-x:hover{ color:var(--ink); border-color:var(--ink); }
.tl-foot{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:12px 16px; border-top:1px solid var(--rule); margin-top:auto; }
.tl-btn{ cursor:pointer; font-family:var(--sans); background:transparent; padding:9px 14px; font-size:14px; }
.tl-hint{ font-size:13px; color:var(--mute); line-height:1.5; }
.tl-out{ border-left:1px solid var(--rule); padding:22px; display:grid; gap:16px; align-content:start; min-width:0; }
.tl-out .sec-label{ margin-bottom:-8px; }
.tl-big{ font-family:var(--display); font-size:clamp(48px,5vw,62px); line-height:1; color:var(--ink); font-variant-numeric:tabular-nums; white-space:nowrap; }
.tl-big small{ font-size:.42em; color:var(--faint); margin-left:6px; }
.tl-dt{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:1px; background:var(--rule); border:1px solid var(--rule); }
.tl-dt div{ background:var(--card); padding:10px 12px; min-width:0; }
.tl-dt b{ display:block; font-family:var(--mono); font-weight:500; font-size:14.5px; color:var(--ink); white-space:nowrap; }
.tl-dt span{ font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); }
.tl-verdict{ padding:12px 14px; border-left:2px solid var(--blue); background:var(--blue-soft); color:var(--ink); font-size:14.5px; line-height:1.55; }
.tl-verdict.miss{ border-left-color:#C8372D; background:color-mix(in srgb,#C8372D 9%,var(--card)); }
.tl-verdict b{ font-weight:600; }
.tl-bars{ display:grid; gap:10px; }
.tl-brow{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 10px; font-size:13.5px; line-height:1.35; color:var(--body); }
.tl-brow .tl-m{ font-family:var(--mono); font-size:12px; color:var(--mute); white-space:nowrap; }
.tl-track{ grid-column:1/-1; height:6px; background:var(--sunk); }
.tl-track i{ display:block; height:100%; background:var(--blue); transition:width .3s ease; }
.tl-brow.top .tl-track i{ background:var(--ink); }
.tl-levers{ margin:0; padding:0; list-style:none; display:grid; gap:8px; }
.tl-levers li{ font-size:13.5px; line-height:1.5; color:var(--body); padding-left:14px; border-left:2px solid var(--rule2); }
.tl-levers b{ font-weight:600; color:var(--ink); }
.tl-soft{ font-size:13px; line-height:1.5; color:var(--mute); }
.tl-rs-inputs{ display:flex; flex-wrap:wrap; gap:10px 18px; }
.tl-acts{ display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; }
.tl-table-wrap{ margin-top:clamp(26px,3.4vw,40px); overflow-x:auto; border:1px solid var(--rule); background:var(--card); }
.tl-table{ width:100%; min-width:560px; border-collapse:collapse; font-size:14.5px; }
.tl-table th,.tl-table td{ padding:12px 16px; text-align:right; border-top:1px solid var(--rule); white-space:nowrap; }
.tl-table thead th{ border-top:none; font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); font-weight:500; }
.tl-table th:first-child,.tl-table td:first-child{ text-align:left; }
.tl-table td{ font-family:var(--mono); font-size:13.5px; color:var(--body); font-variant-numeric:tabular-nums; }
.tl-table tbody th{ font-family:var(--mono); font-weight:500; color:var(--ink); }
.tl-table tr.hl td,.tl-table tr.hl th{ background:var(--blue-soft); }
.tl-related{ display:flex; flex-wrap:wrap; gap:10px; margin-top:18px; }
.tl-bench{ list-style:none; margin:clamp(22px,3vw,34px) 0 0; padding:0; display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr)); gap:1px; background:var(--rule); border:1px solid var(--rule); }
.tl-bench li{ background:var(--card); padding:clamp(18px,2.2vw,24px); display:grid; gap:8px; align-content:start; }
.tl-bench b{ font-family:var(--mono); font-weight:500; font-size:11px; letter-spacing:.14em; color:var(--faint); }
.tl-bench h3{ font-size:16px; font-weight:600; letter-spacing:-.01em; }
.tl-bench p{ font-size:13.5px; line-height:1.55; color:var(--mute); }
@media (max-width:980px){ .tl-inst{ grid-template-columns:1fr; } .tl-out{ border-left:0; border-top:1px solid var(--rule); } }
@media (max-width:620px){
  .tl-head{ display:none; }
  .tl-row,.tl-rs .tl-row{ grid-template-columns:repeat(3,minmax(0,1fr)) 36px; align-items:end; padding:12px 14px; }
  .tl-row > .tl-cell:first-child{ grid-column:1/-1; }
  .tl-lab{ position:static; width:auto; height:auto; display:block; margin-bottom:4px; font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); }
  .tl-chk{ justify-content:flex-start; flex-direction:column; align-items:flex-start; gap:4px; }
  .tl-chk .tl-lab{ margin-bottom:0; }
  .tl-bar,.tl-foot{ padding:12px 14px; }
  .tl-field{ flex:1 1 100%; justify-content:space-between; }
  .tl-field .tl-sel{ flex:1; max-width:62%; }
  .tl-out{ padding:18px 14px; }
  .tl-acts .btn{ flex:1 1 100%; }
}
@media print{ .tl-bar,.tl-foot,.tl-x,.tl-acts,.tl-hero .cta{ display:none !important; } .tl-inst{ grid-template-columns:1fr; } }
</style>

<script>
/* page navigation: mark the section in view */
(function(){var nav=document.querySelector('.pagenav');if(!nav||!('IntersectionObserver' in window))return;
var links=[].slice.call(nav.querySelectorAll('a')),map={};links.forEach(function(a){map[a.getAttribute('href').slice(1)]=a;});
var io=new IntersectionObserver(function(es){es.forEach(function(e){if(!e.isIntersecting)return;links.forEach(function(a){a.classList.remove('on');});var a=map[e.target.id];if(a){a.classList.add('on');a.scrollIntoView({block:'nearest',inline:'nearest'});}});},{rootMargin:'-45% 0px -50% 0px'});
Object.keys(map).forEach(function(id){var el=document.getElementById(id);if(el)io.observe(el);});})();
</script>
